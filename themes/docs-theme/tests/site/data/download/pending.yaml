version: 3.0.0-rc.1
repo: pgsty/docs
tag: v3.0.0-rc.1
published: false
channels:
  - id: repository
    kind: rolling
    title: Package repository
    note: The rolling repository remains available while the pinned candidate is unpublished.
    url: https://repo.example.org/docs/
    steps:
      - code: curl -fsSL https://repo.example.org/docs/install | bash
        lang: bash
  - id: candidate
    kind: pinned
    title: Release candidate
    url: https://github.com/pgsty/docs/releases/tag/${tag}
    steps:
      - code: curl -LO https://github.com/pgsty/docs/releases/download/${tag}/docs-${version}.tar.gz
        lang: bash
    checksums: |
      eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee  docs-3.0.0-rc.1.tar.gz
